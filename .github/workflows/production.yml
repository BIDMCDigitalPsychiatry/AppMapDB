name: Deploy to GitHub Pages
on:
  push:
    branches:
      - master
  # Weekly rebuild so the static pages for search engines (scripts/seo/generate.ts) pick up newly approved
  # and edited apps: Mondays 09:00 UTC (early morning in Boston). New apps work on the site before then;
  # they just aren't in the generated pages and sitemap until the next run. Run it by hand from the
  # Actions tab ("Run workflow") to publish sooner.
  schedule:
    - cron: '0 9 * * 1'
  workflow_dispatch:

# A scheduled run and a push landing together would otherwise race to publish.
concurrency:
  group: deploy-pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Setup pnpm
      uses: pnpm/action-setup@v6
      with:
        version: 10

    - name: Setup Node
      uses: actions/setup-node@v7
      with:
        node-version: 20
        cache: pnpm

    - name: Install
      run: pnpm install --frozen-lockfile

    - name: Build
      run: pnpm build
      env:
        # Endpoint for the search-assistant Lambda (cloud_functions/mind-search-assistant).
        # Set as a repository VARIABLE (Settings > Secrets and variables > Actions > Variables),
        # not a secret: REACT_APP_* values are compiled into the public JS bundle.
        # If unset, the assistant simply does not render — that is the off switch.
        REACT_APP_ASSISTANT_URL: ${{ vars.REACT_APP_ASSISTANT_URL }}
        # Authenticated write API (also in .env). A repo variable, when set,
        # overrides; deleting both reverts to legacy direct writes.
        REACT_APP_WRITE_API_URL: ${{ vars.REACT_APP_WRITE_API_URL || 'https://c9f9mkxos6.execute-api.us-east-1.amazonaws.com' }}

    - name: Deploy
      # v4 renamed the inputs to lowercase and uses the ambient GITHUB_TOKEN
      # by default (last of the Node-deprecation action bumps).
      uses: JamesIves/github-pages-deploy-action@v4
      with:
        branch: gh-pages
        folder: build
        # The ~1,500 generated pages change on every release (they reference that release's script
        # files), so keep only the latest deploy on gh-pages instead of letting its history grow.
        single-commit: true
