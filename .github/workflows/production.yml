name: Deploy to GitHub Pages
on:
  push:
    branches:
      - master
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup pnpm
      uses: pnpm/action-setup@v4
      with:
        version: 10

    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: pnpm

    - name: Install
      run: pnpm install --frozen-lockfile

    - name: Build
      run: pnpm build
      env:
        # Endpoint for the search-assistant Lambda (cloud_functions/mind-search-assistant).
        # Set as a repository VARIABLE (Settings > Secrets and variables > Actions > Variables),
        # not a secret: REACT_APP_* values are compiled into the public JS bundle.
        # If unset, the assistant simply does not render — that is the off switch.
        REACT_APP_ASSISTANT_URL: ${{ vars.REACT_APP_ASSISTANT_URL }}
        # Authenticated write API (also in .env). A repo variable, when set,
        # overrides; deleting both reverts to legacy direct writes.
        REACT_APP_WRITE_API_URL: ${{ vars.REACT_APP_WRITE_API_URL || 'https://c9f9mkxos6.execute-api.us-east-1.amazonaws.com' }}

    - name: Deploy
      uses: JamesIves/github-pages-deploy-action@releases/v3
      with:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        BRANCH: gh-pages
        FOLDER: build
